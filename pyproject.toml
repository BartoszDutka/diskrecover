[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diskrecover"
version = "1.0.0"
description = "Bezpieczne odzyskiwanie danych z obrazów FAT32"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pyinstaller>=6.0.0"]

[project.scripts]
diskrecover = "diskrecover.cli:main"

[tool.setuptools.packages.find]
include = ["diskrecover*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
